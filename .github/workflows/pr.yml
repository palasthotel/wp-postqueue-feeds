name: PR

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  checks:
    uses: palasthotel/github-workflows/.github/workflows/wp-plugin-pr.yml@v1
    with:
      # Plugin Check reports errors on this plugin - see https://github.com/palasthotel/wp-postqueue-feeds/issues/6.
      # Remove this line once they are fixed.
      plugin-check: false
      slug: postqueue-feeds
      dev-plugin-name: Postqueue Feeds (DEV)
      required-files: |
        public-functions.php
        inc/feed.php
        inc/rewrite.php
        inc/postqueue-screen.php
        template/postqueue-feed-rss2.php
        languages/postqueue-feeds.pot
        languages/postqueue-feeds-de_DE.mo
